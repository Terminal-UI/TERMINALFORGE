[project]
name = "terminalforge"
version = "0.3.0"
description = "Unified terminal workspace for developers, DevOps, cloud and optional agentic AI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "textual>=6.1,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.8,<3",
  "platformdirs>=4.2,<5",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
agentic = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-google-genai>=3.0,<4",
  "crewai>=1.15,<2",
]
observability = ["langsmith>=0.4,<1"]
all = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-google-genai>=3.0,<4",
  "crewai>=1.15,<2",
  "langsmith>=0.4,<1",
]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
tf = "terminalforge.cli:main"
terminalforge = "terminalforge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
